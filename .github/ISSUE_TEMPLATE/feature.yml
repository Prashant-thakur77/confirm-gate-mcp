name: Feature request
description: Suggest something the gate should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work, from the user's or the developer's side.
    validations:
      required: true
  - type: textarea
    id: gate
    attributes:
      label: Effect on the guarantee
      description: |
        Does this change who or what can release a write, what reaches the agent, or what a receipt records?
        If it does, say how the agent still can't approve its own action.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
